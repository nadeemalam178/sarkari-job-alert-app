name: Sarkari Result Automated Scraper & Alert Cron

on:
  schedule:
    # Runs every 2 hours automatically 24/7
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions UI
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'README.md'

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit updated data/jobs.json

    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sarkari Job Scraper & Push Alerts
        run: |
          python scraper.py

      - name: Commit & Push Updated Jobs Cache
        run: |
          git config --global user.name "Sarkari Alert Bot"
          git config --global user.email "bot@sarkarijobalert.app"
          git add data/jobs.json data/settings.json
          if git diff --staged --quiet; then
            echo "No new jobs found. Skipping commit."
          else
            git commit -m "Automated Sarkari Result update [skip ci]"
            git push
          fi
