name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (Expo SDK 58)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: expo-mobile/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: ./expo-mobile
        run: npm ci

      - name: ⚙️ Expo Prebuild (Generate Android Native Project)
        working-directory: ./expo-mobile
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Set Gradle Permissions
        run: chmod +x ./expo-mobile/android/gradlew

      - name: 🔨 Build Android APK
        working-directory: ./expo-mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sarkari-Job-Alert-APK-v1.0.1
          path: ./expo-mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
